name: Publish to ClawHub

# Publishes the plugin to ClawHub, which is where installs and the plugin's own
# update check get it from. Builds the plugin from a commit, packs it with
# `npm pack`, and hands that tarball to ClawHub's reusable publish workflow.
#
# Two ways in:
# - The Bump version workflow calls this with the release tag it just pushed,
#   for real. That is the normal release: a merge to main is not a release,
#   the bump is, and the bump publishes.
# - By hand (Actions → Publish to ClawHub), from the branch or tag picked in
#   "Use workflow from", to re-publish a version or to preview one. A dry run by
#   default: it validates the package and shows what would be published,
#   without uploading.
#
# A real publish waits until ClawHub's security checks make the release public
# (up to 30 minutes) and fails if they block it.
#
# Setup (once):
# - Repository secret CLAWHUB_TOKEN: a ClawHub API token (clh_...) from an
#   account that can publish for the `filament-dm` owner (ClawHub → Settings →
#   API tokens, or `clawhub token` after `clawhub login`).
# - After the first real publish, trusted publishing can replace the token for
#   these manual runs:
#     clawhub package trusted-publisher set @filament-dm/filament-openclaw \
#       --repository filament-dm/filament-openclaw \
#       --workflow-filename package-publish.yml
#   A release started by Bump version runs under bump-version.yml, so it keeps
#   using the token until that file is trusted as well.
#
# ClawHub keeps every published version; publishing one twice fails.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: validate and preview only, publish nothing."
        type: boolean
        required: false
        default: true
      changelog:
        description: "Release notes shown on ClawHub (optional)."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "The tag or commit to build and publish."
        type: string
        required: true
      dry_run:
        type: boolean
        required: false
        default: false
      changelog:
        type: string
        required: false
        default: ""
    secrets:
      CLAWHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      source_ref: ${{ steps.source.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty by hand: the commit the run was started from.
          ref: ${{ inputs.ref || github.sha }}

      - name: Record the source
        id: source
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # A release passes its tag (vX.Y.Z); by hand, the ref the run started from.
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "source_ref=refs/tags/${REF}" >> "$GITHUB_OUTPUT"
          else
            echo "source_ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Committed dist/ matches the build
        run: |
          changed="$(git status --porcelain -- dist)"
          if [ -n "$changed" ]; then
            echo "::error::dist/ does not match the source. Run 'npm run build' and commit dist/."
            echo "$changed"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Read the version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          manifest="$(node -p "require('./openclaw.plugin.json').version")"
          if [ "$version" != "$manifest" ]; then
            echo "::error::package.json ($version) and openclaw.plugin.json ($manifest) disagree on the version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        id: pack
        run: |
          # --ignore-scripts: ship exactly what `npm run build` just produced.
          mkdir -p clawpack
          file="$(npm pack --ignore-scripts --pack-destination clawpack | tail -n1)"
          echo "tarball=clawpack/${file}" >> "$GITHUB_OUTPUT"
          {
            echo "### ClawHub package"
            echo "- commit: \`${{ steps.source.outputs.commit }}\`"
            echo "- version: \`${{ steps.version.outputs.version }}\`"
            echo "- dry run: \`${{ inputs.dry_run }}\`"
            echo "- tarball: \`${file}\`"
            echo "- sha256: \`$(sha256sum "clawpack/${file}" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: clawpack
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    permissions:
      actions: read # download the clawpack artifact
      contents: read
      id-token: write # trusted publishing, and how the reusable workflow finds its own source
    # Pinned to a commit of openclaw/clawhub main (2026-11-19). To update, replace
    # the SHA with a newer commit of that repository.
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@a8d742ae1d61cec53dc6b0834cc81d49945dfd63
    with:
      owner: filament-dm
      family: code-plugin
      package_artifact_name: clawpack
      dry_run: ${{ inputs.dry_run }}
      changelog: ${{ inputs.changelog }}
      topics: filament,messaging,chat,agents,mcp
      # The built commit, not the run's: a release builds the tag Bump version pushed.
      source_repo: ${{ github.repository }}
      source_commit: ${{ needs.build.outputs.commit }}
      source_ref: ${{ needs.build.outputs.source_ref }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
