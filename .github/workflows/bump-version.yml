---
name: Bump version
run-name: "Bump version · ${{ inputs.level }} · by @${{ github.actor }}"

# The release: `npm version` on main, then a publish to ClawHub. The `version`
# lifecycle script copies the number into openclaw.plugin.json and
# src/version.ts and rebuilds dist/; npm commits "Release vX.Y.Z" and tags it.
# The publish job then builds that tag and publishes it to ClawHub, which is
# what installs and the plugin's daily update check read. Once ClawHub's
# security checks pass (up to 30 minutes), running gateways offer the update in
# the principal's backchannel within a day.

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        required: true
        default: patch

permissions:
  contents: write # push the bump commit and its tag

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Bump, rebuild, commit, tag
        id: bump
        run: |
          # The github-actions[bot] account (user id 41898282), so GitHub attributes the commit to it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.level }}" -m "Release v%s"
          version="$(node -p 'require("./package.json").version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push v${{ steps.bump.outputs.version }}
        run: |
          git push --follow-tags origin main
          echo "Released **v${{ steps.bump.outputs.version }}** (${{ inputs.level }})." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: bump
    permissions:
      actions: read # download the packed artifact
      contents: read
      id-token: write # ClawHub's reusable workflow
    uses: ./.github/workflows/package-publish.yml
    with:
      ref: v${{ needs.bump.outputs.version }}
      changelog: "Release v${{ needs.bump.outputs.version }}"
    secrets:
      CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
